<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>@csbc-dev/stripe · @wcstack/state</title>

    <!-- Single self-contained file: state, data-wcs bindings, setup module, and
         CSS all live here (CONVENTIONS.md §6). Served verbatim by ../delivery
         on port 5176; the /vendor/* specifiers below resolve to the local repo
         build that ../delivery also serves. -->
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f6fb;
        --panel: #ffffff;
        --ink: #14213d;
        --muted: #6b7280;
        --line: #e5e7eb;
        --brand: #635bff;
        --brand-strong: #4b45c6;
        --ok: #16a34a;
        --warn: #dc2626;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        max-width: 560px;
        margin: 48px auto;
        padding: 0 20px;
      }

      header h1 { font-size: 1.5rem; margin: 0 0 4px; }
      header p { color: var(--muted); margin: 0 0 24px; }

      code { background: rgba(99, 91, 255, 0.1); padding: 1px 5px; border-radius: 4px; font-size: 0.85em; }

      .mode-tag {
        background: var(--brand);
        color: #fff;
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 0.78rem;
        font-weight: 600;
      }

      stripe-checkout {
        display: block;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 18px;
        margin: 16px 0;
        min-height: 60px;
      }

      .mock-pe {
        border: 1px dashed var(--brand);
        border-radius: 8px;
        padding: 18px;
        text-align: center;
        color: var(--brand-strong);
        background: rgba(99, 91, 255, 0.04);
      }
      .mock-pe small { color: var(--muted); }

      .row {
        display: flex;
        gap: 12px;
        align-items: center;
        margin: 12px 0;
      }
      .row label { color: var(--muted); font-size: 0.92rem; }

      select {
        padding: 6px 10px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
      }

      .state {
        display: grid;
        gap: 8px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 16px;
        margin: 16px 0;
      }
      .state > div { display: flex; justify-content: space-between; gap: 12px; }
      .state dt { color: var(--muted); margin: 0; }
      .state dd { margin: 0; font-variant-numeric: tabular-nums; text-align: right; }

      .badge {
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 2px 8px;
        border-radius: 999px;
        background: var(--line);
        color: var(--muted);
      }
      .badge.collecting { background: #e0e7ff; color: #3730a3; }
      .badge.processing { background: #fef3c7; color: #92400e; }
      .badge.requires_action { background: #fde68a; color: #92400e; }
      .badge.succeeded { background: #dcfce7; color: #166534; }
      .badge.failed { background: #fee2e2; color: #991b1b; }

      button {
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-size: 0.95rem;
        font-weight: 600;
        cursor: pointer;
        background: var(--brand);
        color: #fff;
      }
      button:hover { background: var(--brand-strong); }
      button:disabled { opacity: 0.45; cursor: not-allowed; }
      button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
      button.ghost:hover { background: var(--bg); }

      .error {
        color: var(--warn);
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 8px;
        padding: 10px 14px;
      }

      .hint { color: var(--muted); font-size: 0.85rem; }
    </style>

    <!-- Resolve bare specifiers for the buildless runtime. @csbc-dev/stripe and
         its @wc-bindable deps are served from the local repo build (/vendor/*,
         mounted by ../delivery); @wcstack/state comes from the CDN. After the
         package is published, swap these to pinned esm.run URLs (see README). -->
    <script type="importmap">
      {
        "imports": {
          "@csbc-dev/stripe": "/vendor/csbc/index.js",
          "@wc-bindable/core": "/vendor/wcb-core/index.js",
          "@wc-bindable/remote": "/vendor/wcb-remote/index.js",
          "@stripe/stripe-js": "https://esm.run/@stripe/stripe-js@5"
        }
      }
    </script>

    <!-- 1. Configure Stripe + register <stripe-checkout> (defines the element
            BEFORE @wcstack/state scans data-wcs — CONVENTIONS.md §6 ordering). -->
    <script type="module">
      import { bootstrapStripe, WcsStripe } from "@csbc-dev/stripe";

      // --- Mock Stripe.js loader (no Stripe account needed) ---
      function createMockStripeLoader() {
        return async () => ({
          elements() {
            let paymentElement = null;
            return {
              create() {
                const handlers = {};
                paymentElement = {
                  mount(target) {
                    const host = typeof target === "string" ? document.querySelector(target) : target;
                    if (host) {
                      host.innerHTML =
                        '<div class="mock-pe">🧪 Mock Stripe Elements' +
                        "<br><small>No real card needed — click Pay to simulate a successful charge.</small></div>";
                    }
                    setTimeout(() => {
                      handlers.ready && handlers.ready({});
                      handlers.change && handlers.change({ complete: true });
                    }, 0);
                  },
                  unmount() {},
                  destroy() {},
                  on(event, cb) { handlers[event] = cb; },
                };
                return paymentElement;
              },
              getElement() { return paymentElement; },
            };
          },
          async confirmPayment() {
            return {
              paymentIntent: {
                id: "pi_mock",
                status: "succeeded",
                payment_method: { id: "pm_mock_card", card: { brand: "visa", last4: "4242" } },
              },
            };
          },
          async confirmSetup() {
            return {
              setupIntent: {
                id: "seti_mock",
                status: "succeeded",
                payment_method: { id: "pm_mock_card", card: { brand: "visa", last4: "4242" } },
              },
            };
          },
        });
      }

      // To use REAL Stripe: set this to your pk_test_... and start the server
      // with STRIPE_SECRET_KEY set (see ../server/.env.example).
      const PUBLISHABLE_KEY = "pk_test_mock_000";
      const IS_MOCK = PUBLISHABLE_KEY === "pk_test_mock_000";

      if (IS_MOCK) WcsStripe.setLoader(createMockStripeLoader());

      // Enable remote mode + register <stripe-checkout>.
      bootstrapStripe({
        remote: {
          enableRemote: true,
          remoteSettingType: "config",
          remoteCoreUrl: "ws://localhost:8787/stripe",
        },
      });

      // Keep the header badge honest: the static "mock" label below is a default
      // — reflect the real mode so swapping in a live pk_test_ key flips it.
      const modeTag = document.querySelector(".mode-tag");
      if (modeTag) modeTag.textContent = IS_MOCK ? "mock" : "live test";

      // publishable-key / return-url are not wcBindable inputs — set them as
      // attributes. Setting publishable-key last triggers auto-prepare.
      const el = document.querySelector("stripe-checkout");
      if (el) {
        el.setAttribute("return-url", location.origin + location.pathname);
        el.setAttribute("publishable-key", PUBLISHABLE_KEY);
      }
    </script>

    <!-- 2. @wcstack/state auto-runtime: processes <wcs-state> + data-wcs. Pinned
            to a major so a future breaking release can't silently break this
            buildless file. -->
    <script type="module" src="https://esm.run/@wcstack/state@1/auto"></script>
  </head>

  <body>
    <!-- Reactive store. Outputs are synced FROM <stripe-checkout>; inputs are
         pushed TO it. -->
    <wcs-state>
      <script type="module">
        export default {
          // inputs pushed to <stripe-checkout> (amount-value is only a HINT).
          mode: "payment",
          amountValue: 1980,
          amountCurrency: "jpy",

          // outputs synced from <stripe-checkout>.
          status: "idle",
          loading: false,
          amount: null,
          paymentMethod: null,
          intentId: null,
          error: null,

          get isCollecting() { return this.status === "collecting"; },
          get isProcessing() { return this.status === "processing"; },
          get isRequiresAction() { return this.status === "requires_action"; },
          get isSucceeded() { return this.status === "succeeded"; },
          get isFailed() { return this.status === "failed"; },
          get canPay() { return this.status === "collecting" && !this.loading; },
          get payLabel() { return this.mode === "setup" ? "Save card" : "Pay"; },

          get amountLabel() {
            const a = this.amount;
            if (!a) return "—";
            const zeroDecimal = String(a.currency).toLowerCase() === "jpy";
            try {
              return new Intl.NumberFormat(undefined, { style: "currency", currency: a.currency })
                .format(zeroDecimal ? a.value : a.value / 100);
            } catch {
              return a.value + " " + a.currency;
            }
          },
          get pmLabel() {
            return this.paymentMethod
              ? this.paymentMethod.brand + " •• " + this.paymentMethod.last4
              : "—";
          },
          get intentLabel() { return this.intentId || "—"; },
          get errorMessage() {
            if (!this.error) return "";
            return this.error.message + (this.error.code ? " (" + this.error.code + ")" : "");
          },

          // commands are plain methods — call the element imperatively.
          pay() {
            if (this.canPay) document.querySelector("stripe-checkout").submit();
          },
          resetCheckout() {
            document.querySelector("stripe-checkout").reset();
          },
          setMode(e) {
            // Switching mode needs a clean slate; the element re-prepares.
            document.querySelector("stripe-checkout").reset();
            this.mode = e.target.value;
          },
        };
      </script>
    </wcs-state>

    <main>
      <header>
        <h1>@csbc-dev/stripe × @wcstack/state</h1>
        <p>
          <code>&lt;stripe-checkout&gt;</code> bound declaratively with
          <code>data-wcs</code> · <span class="mode-tag">mock</span> mode
        </p>
      </header>

      <div class="row">
        <label>mode</label>
        <select data-wcs="onchange: setMode">
          <option value="payment">payment</option>
          <option value="setup">setup</option>
        </select>
      </div>

      <!-- Inputs (mode/amountValue/amountCurrency) flow store -> element;
           outputs (status/loading/amount/paymentMethod/intentId/error) flow
           element -> store. publishable-key/return-url are set in the setup
           module above.

           NOTE: the static mode/amount-value/amount-currency attributes look
           redundant with the data-wcs input bindings below (both carry the same
           initial values), but they are KEPT ON PURPOSE. The setup module sets
           `publishable-key` last, which triggers the element's auto-prepare as
           soon as it connects — that can happen before @wcstack/state's first
           store->element push lands. The static attributes seed the element's
           initial config so auto-prepare sees the right amount/mode/currency
           (not null) and never emits a stale-config warning. After connect, the
           data-wcs bindings take over and keep them in sync with the store. -->
      <stripe-checkout
        id="checkout"
        mode="payment"
        amount-value="1980"
        amount-currency="jpy"
        data-wcs="
          mode: mode;
          amountValue: amountValue;
          amountCurrency: amountCurrency;
          status: status;
          loading: loading;
          amount: amount;
          paymentMethod: paymentMethod;
          intentId: intentId;
          error: error
        "
      ></stripe-checkout>

      <dl class="state">
        <div>
          <dt>status</dt>
          <dd>
            <span
              class="badge"
              data-wcs="
                textContent: status;
                class.collecting: isCollecting;
                class.processing: isProcessing;
                class.requires_action: isRequiresAction;
                class.succeeded: isSucceeded;
                class.failed: isFailed
              "
            ></span>
          </dd>
        </div>
        <div><dt>loading</dt><dd data-wcs="textContent: loading"></dd></div>
        <div><dt>amount (server total)</dt><dd data-wcs="textContent: amountLabel"></dd></div>
        <div><dt>paymentMethod</dt><dd data-wcs="textContent: pmLabel"></dd></div>
        <div><dt>intentId</dt><dd><code data-wcs="textContent: intentLabel"></code></dd></div>
      </dl>

      <template data-wcs="if: error">
        <p class="error" data-wcs="textContent: errorMessage"></p>
      </template>

      <div class="row">
        <button data-wcs="onclick: pay; disabled: canPay|not; textContent: payLabel"></button>
        <button class="ghost" data-wcs="onclick: resetCheckout">Reset</button>
      </div>

      <p class="hint">
        The <strong>amount</strong> shown comes from the server's IntentBuilder, not the
        <code>amount-value</code> attribute — the Core owns the decision.
      </p>
    </main>
  </body>
</html>
